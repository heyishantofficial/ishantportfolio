[variables]
NIXPACKS_NODE_VERSION = "22"
NIXPACKS_NO_CACHE = "1"
NEXT_TELEMETRY_DISABLED = "1"
# Must match the Dockerfile and the volume mounted in Dokploy.
DATA_DIR = "/app/data"

[phases.setup]
# The CMS (/admin) encodes uploads with ffmpeg and cwebp. "..." keeps Node.
nixPkgs = ["...", "ffmpeg-headless", "libwebp"]

[phases.install]
cmds = ["npm ci --include=dev"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "node server/index.js"
